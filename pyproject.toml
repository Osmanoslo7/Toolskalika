[project]
name = "clipengine"
version = "0.1.0b0"
description = "Vice City Clip Engine: local gameplay highlight detection and editing"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipengine = "clipengine.cli:main"

[tool.setuptools]
packages = ["clipengine", "clipengine.detect", "clipengine.dashboard", "clipengine.intelligence"]

[tool.setuptools.package-data]
"clipengine.dashboard" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
