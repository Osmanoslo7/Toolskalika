<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Review</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --quiet: #6b6b66; --line: #e2e2dc;
  --accent: #2463eb; --good: #1a7f37; --warn: #9a6700; --bad: #c62828; --chip: #efefea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ececea; --quiet: #a3a39d; --line: #33332f;
    --accent: #6c9bff; --good: #4ac26b; --warn: #d4a72c; --bad: #ff6b6b; --chip: #2a2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px;
         background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
header input { flex: 1 1 260px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
               background: var(--bg); color: var(--ink); font: inherit; }
button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--chip);
         color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--quiet); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.approve.on { background: var(--good); border-color: var(--good); color: #fff; }
button.reject.on { background: var(--bad); border-color: var(--bad); color: #fff; }
#jobs { width: 100%; color: var(--quiet); font-size: 12px; min-height: 1em; }
main { display: grid; grid-template-columns: 280px 1fr; gap: 16px; padding: 16px; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.rec { display: flex; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; align-items: center; }
.rec:hover, .rec.sel { background: var(--chip); }
.rec img { width: 96px; height: 54px; object-fit: cover; border-radius: 4px; background: #000; flex: none; }
.rec .n { font-weight: 600; overflow-wrap: anywhere; }
.meta { color: var(--quiet); font-size: 12px; }
.thumbs { display: flex; gap: 6px; overflow-x: auto; margin: 8px 0; }
.thumbs img { height: 60px; border-radius: 4px; }
canvas { width: 100%; height: 70px; display: block; margin: 8px 0 4px; }
.filters { display: flex; gap: 6px; margin: 12px 0; flex-wrap: wrap; }
.filters button.on { background: var(--ink); color: var(--panel); }
.cand { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; background: var(--panel); }
.cand.approved { border-left: 4px solid var(--good); }
.cand.rejected { border-left: 4px solid var(--bad); opacity: .75; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.title { font-weight: 600; font-size: 15px; }
.conf { width: 120px; height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.conf > i { display: block; height: 100%; background: var(--accent); }
ul.reasons { margin: 8px 0; padding-left: 18px; }
ul.reasons li.note { color: var(--quiet); list-style: circle; }
.videos { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; align-items: flex-start; }
.vid { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; max-width: 100%; }
.vid video { background: #000; border-radius: 6px; }
.vid.l { width: min(480px, 100%); }
.vid.l video { width: 100%; aspect-ratio: 16/9; }
.vid.v video { width: 152px; height: 270px; }
.vid.v .meta { max-width: 220px; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--chip); }
.badge.passed { color: var(--good); } .badge.warning { color: var(--warn); } .badge.failed { color: var(--bad); }
details { font-size: 12px; color: var(--quiet); }
.lvl-fail { color: var(--bad); } .lvl-warn { color: var(--warn); }
.empty { color: var(--quiet); padding: 24px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Clip Review</h1>
  <input id="importPath" placeholder="Path to a recording or folder on this computer (MP4, MOV, WebM, MKV)">
  <button id="importBtn" class="primary">Import &amp; analyse</button>
  <button id="exportBtn" title="Copy approved clips that passed QA into an export folder">Export approved</button>
  <div id="jobs"></div>
</header>
<main>
  <section class="panel"><div class="meta" style="margin-bottom:6px">Recordings</div><div id="recs"></div></section>
  <section id="detail"><div class="panel empty">Import a recording or select one on the left.</div></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mmss = t => `${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,"0")}`;
let current = null, filter = "all", busy = false;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  return r.json();
}

async function loadRecs() {
  const recs = await api("/api/media");
  $("#recs").innerHTML = recs.length ? recs.map(m => `
    <div class="rec ${m.id === current ? "sel" : ""}" data-id="${m.id}">
      ${m.thumb_url ? `<img src="${m.thumb_url}" alt="">` : ""}
      <div><div class="n">${esc(m.name)}</div>
      <div class="meta">${m.duration_s.toFixed(0)}s · ${m.width}×${m.height} · ${m.n_candidates} clips
      ${m.approved ? `· ${m.approved} approved` : ""}</div></div></div>`).join("")
    : `<div class="empty">No recordings yet.</div>`;
  document.querySelectorAll(".rec").forEach(el => el.onclick = () => select(+el.dataset.id));
}

async function select(id) { current = id; await loadRecs(); await loadDetail(); }

function drawTimeline(tl, cands, dur) {
  const c = $("#tl"); if (!c || !tl) return;
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const X = t => t / dur * w;
  cands.forEach(k => { g.fillStyle = k.status === "rejected" ? "rgba(198,40,40,.15)" : "rgba(36,99,235,.18)";
                       g.fillRect(X(k.start_s), 0, X(k.end_s) - X(k.start_s), h); });
  g.strokeStyle = css.getPropertyValue("--quiet"); g.globalAlpha = .5;
  tl.scene_cuts.forEach(t => { g.beginPath(); g.moveTo(X(t), h - 10); g.lineTo(X(t), h); g.stroke(); });
  g.globalAlpha = 1; g.strokeStyle = css.getPropertyValue("--accent"); g.lineWidth = 1.5; g.beginPath();
  tl.fused.forEach((v, i) => { const x = X(i * tl.hop_s), y = h - 12 - v * (h - 16); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
}

function qaBlock(r) {
  if (!r.qa) return `<span class="badge">QA pending</span>`;
  const bad = r.qa.checks.filter(c => c.level !== "pass");
  return `<span class="badge ${r.qa_status}">QA ${r.qa_status}</span>
    <details><summary>${bad.length ? bad.length + " issue(s)" : "all checks passed"}</summary>
    ${r.qa.checks.map(c => `<div class="lvl-${c.level}">${c.level} · ${esc(c.name)}: ${esc(c.message)}</div>`).join("")}</details>`;
}

async function loadDetail() {
  if (current == null) return;
  const d = await api(`/api/media/${current}`);
  const m = d.media, cands = d.candidates.filter(c => filter === "all" || c.status === filter);
  $("#detail").innerHTML = `
    <div class="panel">
      <div class="row"><div class="title">${esc(m.name)}</div>
        <button id="reanalyse">Re-analyse</button></div>
      <div class="meta">${esc(m.path)}<br>${m.duration_s.toFixed(1)}s · ${m.width}×${m.height} · ${m.fps} fps ·
        ${esc(m.video_codec)}/${esc(m.audio_codec || "no audio")} · ${(m.size_bytes/1e6).toFixed(1)} MB (original, read-only)</div>
      <div class="thumbs">${d.thumbnails.map(t => `<img src="${t.url}" title="${mmss(t.t_s)}" alt="">`).join("")}</div>
      <canvas id="tl"></canvas>
      <div class="meta">Highlight score over time · shaded = candidate clips · ticks = scene cuts</div>
    </div>
    <div class="filters">${["all","new","approved","rejected"].map(f =>
      `<button data-f="${f}" class="${f === filter ? "on" : ""}">${f}</button>`).join("")}</div>
    ${cands.length ? "" : `<div class="panel empty">No ${filter === "all" ? "" : filter} candidates.</div>`}
    ${cands.map((c, i) => `
      <div class="cand ${c.status}">
        <div class="row">
          <div class="title">${esc(c.description)}</div>
          <span class="badge">${mmss(c.start_s)} – ${mmss(c.end_s)} · ${c.duration_s.toFixed(1)}s</span>
          <span class="conf" title="confidence"><i style="width:${(c.confidence*100).toFixed(0)}%"></i></span>
          <span>${(c.confidence*100).toFixed(0)}%</span>
        </div>
        <ul class="reasons">${c.reasons.signals.map(s => `<li>${esc(s.text)}</li>`).join("")}
          ${c.reasons.notes.map(n => `<li class="note">${esc(n)}</li>`).join("")}</ul>
        <div class="row">
          <button class="approve ${c.status === "approved" ? "on" : ""}" data-s="approved" data-c="${c.id}">Approve</button>
          <button class="reject ${c.status === "rejected" ? "on" : ""}" data-s="rejected" data-c="${c.id}">Reject</button>
          <button data-render="${c.id}">${c.renders.length ? "Re-render" : "Render clips"}</button>
        </div>
        <div class="videos">${c.renders.map(r => `
          <div class="vid ${r.height > r.width ? "v" : "l"}">
            <video controls preload="metadata" src="${r.url}" poster="${r.thumb_url || ""}"></video>
            <div class="meta">${esc(r.preset)} ${r.width}×${r.height} · ${(r.size_bytes/1e6).toFixed(1)} MB · rendered in ${r.render_s.toFixed(1)}s</div>
            ${qaBlock(r)}
          </div>`).join("")}</div>
      </div>`).join("")}`;
  drawTimeline(d.timeline, d.candidates, m.duration_s);
  $("#reanalyse").onclick = async () => { await api(`/api/media/${current}/analyze`, {}); pollJobs(); };
  document.querySelectorAll(".filters button").forEach(b => b.onclick = () => { filter = b.dataset.f; loadDetail(); });
  document.querySelectorAll("[data-s]").forEach(b => b.onclick = async () => {
    const already = b.classList.contains("on");
    await api(`/api/candidates/${b.dataset.c}/status`, {status: already ? "new" : b.dataset.s});
    loadDetail(); loadRecs();
  });
  document.querySelectorAll("[data-render]").forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = "Queued…"; await api(`/api/candidates/${b.dataset.render}/render`, {}); pollJobs();
  });
}

async function pollJobs() {
  const jobs = await api("/api/jobs");
  const active = jobs.filter(j => j.status === "queued" || j.status === "running");
  const last = jobs[0];
  $("#jobs").textContent = active.length
    ? `Working: ${active.map(j => `${j.kind} (${j.status})`).join(", ")}`
    : last ? `Last job: ${last.kind} ${last.status}${last.message ? " — " + last.message : ""}` : "";
  if (active.length) { busy = true; setTimeout(pollJobs, 1500); }
  else if (busy) { busy = false; loadRecs(); loadDetail(); }
}

$("#importBtn").onclick = async () => {
  const path = $("#importPath").value.trim(); if (!path) return;
  await api("/api/import", {path}); $("#importPath").value = ""; pollJobs();
};
$("#exportBtn").onclick = async () => {
  const r = await api("/api/export", {});
  $("#jobs").textContent = `Exported ${r.exported} file(s) to ${r.path}` +
    (r.skipped.length ? ` · skipped ${r.skipped.length} (not rendered or failed QA)` : "");
};
window.addEventListener("resize", () => current != null && loadDetail());
loadRecs(); pollJobs();
</script>
</body>
</html>
