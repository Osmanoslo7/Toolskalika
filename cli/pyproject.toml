[project]
name = "toolskalika"
version = "0.1.0"
description = "CLI for your personal Toolskalika API"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
toolskalika = "toolskalika.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["toolskalika*"]
